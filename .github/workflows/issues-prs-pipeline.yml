name: Automated Issues and Pull Requests Generator

on:
  workflow_dispatch:
    inputs:
      cycle_count:
        description: 'Number of Issue + PR cycles to generate (recommended: 3 to 10)'
        required: false
        default: '5'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-issues-and-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME || vars.GIT_USER_NAME || github.actor }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL || vars.GIT_USER_EMAIL || format('{0}+{1}@users.noreply.github.com', github.actor_id, github.actor) }}"

      - name: Execute Issue and PR Generation Cycles
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          CYCLES: ${{ inputs.cycle_count || 5 }}
        run: |
          echo "Starting generation of $CYCLES Issue + PR cycles..."

          for k in $(seq 1 "$CYCLES"); do
            echo "=========================================="
            echo "Starting Cycle $k of $CYCLES"
            echo "=========================================="

            # 1. Create Issue
            ISSUE_URL=$(gh issue create \
              --title "Improvement Task #${k} (Run #${{ github.run_number }})" \
              --body "Automated tracking issue for development cycle #${k} in run ${{ github.run_id }}." \
              --label "automated-test")
            ISSUE_NUM=$(gh issue view "$ISSUE_URL" --json number -q .number)
            echo "Created Issue #${ISSUE_NUM}: $ISSUE_URL"

            # Polite pause to respect GitHub secondary rate limits
            sleep 2

            # 2. Create Branch and Single Lightweight Commit
            BRANCH_NAME="feat/task-${ISSUE_NUM}-${{ github.run_id }}-${k}"
            git checkout -b "$BRANCH_NAME" origin/main

            mkdir -p .automation/tasks
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "- Task #${ISSUE_NUM} logged at ${TIMESTAMP}" >> ".automation/tasks/task-${ISSUE_NUM}.md"

            git add ".automation/tasks/task-${ISSUE_NUM}.md"
            git commit -m "feat(tasks): resolve task #${ISSUE_NUM} [skip ci]"
            git push origin "$BRANCH_NAME"

            sleep 2

            # 3. Open Pull Request linked to the Issue
            PR_URL=$(gh pr create \
              --title "feat(tasks): resolve task #${ISSUE_NUM}" \
              --body "Resolves #${ISSUE_NUM}" \
              --base main \
              --head "$BRANCH_NAME")
            echo "Opened Pull Request: $PR_URL"

            sleep 2

            # 4. Merge Pull Request and Delete Remote Branch
            gh pr merge "$PR_URL" --merge --delete-branch --admin || \
            gh pr merge "$PR_URL" --merge --delete-branch

            # 5. Ensure Issue is Closed
            STATUS=$(gh issue view "$ISSUE_NUM" --json state -q .state)
            if [ "$STATUS" != "CLOSED" ]; then
              gh issue close "$ISSUE_NUM" --comment "Resolved via $PR_URL."
            fi

            # Clean up local branch and sync main for next cycle
            git checkout main
            git pull origin main

            echo "Cycle $k completed successfully."
            sleep 3
          done

          echo "All $CYCLES Issue + PR cycles completed!"
