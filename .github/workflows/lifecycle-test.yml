name: Educational Lifecycle Test (Issue -> PR -> Merge -> Cleanup)

on:
  schedule:
    - cron: '0 6,14,22 * * *'  # Runs 3 times a day (06:00, 14:00, 22:00 UTC)
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Number of commits to generate in this batch'
        required: false
        default: '100'
        type: string
      task_title:
        description: 'Title for the test task'
        required: false
        default: 'Automated batch lifecycle task'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lifecycle-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git Author from Secrets or Context
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME || vars.GIT_USER_NAME || github.actor }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL || vars.GIT_USER_EMAIL || format('{0}+{1}@users.noreply.github.com', github.actor_id, github.actor) }}"

      - name: Step 1 - Create an Issue (Ticket)
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          TITLE: ${{ inputs.task_title || 'Automated batch lifecycle task' }}
        run: |
          ISSUE_URL=$(gh issue create \
            --title "$TITLE (Run #${{ github.run_number }})" \
            --body "Educational test: automatically created by GitHub Actions run ${{ github.run_id }}." \
            --label "automated-test")
          echo "Created Issue: $ISSUE_URL"
          ISSUE_NUM=$(gh issue view "$ISSUE_URL" --json number -q .number)
          echo "issue_number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      - name: Step 2 - Create Branch and Batch Commit Changes
        id: create_branch
        env:
          COMMIT_COUNT: ${{ inputs.commit_count || 100 }}
        run: |
          ISSUE_NUM="${{ steps.create_issue.outputs.issue_number }}"
          BRANCH_NAME="automation/task-${ISSUE_NUM}-${{ github.run_id }}"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          git checkout -b "$BRANCH_NAME"
          mkdir -p .automation

          echo "Generating $COMMIT_COUNT commits in batch..."
          for i in $(seq 1 "$COMMIT_COUNT"); do
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "- **Run ${{ github.run_id }}** | Issue #${ISSUE_NUM} | Step ${i}/${COMMIT_COUNT} | ${TIMESTAMP}" >> .automation/activity.md
            git add .automation/activity.md
            git commit -m "feat(automation): update activity log step ${i}/${COMMIT_COUNT} (#${ISSUE_NUM}) [skip ci]"
          done

          git push origin "$BRANCH_NAME"

      - name: Step 3 - Open a Pull Request
        id: open_pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ steps.create_issue.outputs.issue_number }}"
          BRANCH_NAME="${{ steps.create_branch.outputs.branch_name }}"

          PR_URL=$(gh pr create \
            --title "feat(automation): automated resolution for #${ISSUE_NUM}" \
            --body "Automated test pull request.\n\nCloses #${ISSUE_NUM}" \
            --base main \
            --head "$BRANCH_NAME")
          echo "Opened PR: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Step 4 - Merge Pull Request and Delete Branch
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ steps.open_pr.outputs.pr_url }}"
          # Merge using standard merge commit to preserve all batch commits on main
          gh pr merge "$PR_URL" --merge --delete-branch --admin || \
          gh pr merge "$PR_URL" --merge --delete-branch

      - name: Step 5 - Ensure Issue is Closed
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ steps.create_issue.outputs.issue_number }}"
          STATUS=$(gh issue view "$ISSUE_NUM" --json state -q .state)
          if [ "$STATUS" != "CLOSED" ]; then
            gh issue close "$ISSUE_NUM" --comment "Closed via automated test workflow run ${{ github.run_id }}."
          fi
          echo "Issue #${ISSUE_NUM} is closed."
